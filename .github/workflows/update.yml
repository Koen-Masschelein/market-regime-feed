name: Update index feed
on:
  schedule:
    # 4x daily (UTC), timed after major market closes; GitHub may delay by a few minutes
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_indexes.py
      - name: Commit updated feed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/indexes-live.json
          git diff --cached --quiet || git commit -m "Update index feed"
          git push
